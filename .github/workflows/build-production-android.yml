name: Build Production Android

on:
  push:
    branches:
      - main

jobs:
  android_build:
    runs-on: ubuntu-latest
    steps:
      - name: Check for EXPO_TOKEN
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "You must provide an EXPO_TOKEN secret linked to this project's Expo account in this repo's secrets. Learn more: https://docs.expo.dev/eas-update/github-actions"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Check for a production build with this native fingerprint
        id: build_status
        run: bash scripts/ci/production-build-status.sh

      - name: Skip build (native unchanged)
        if: steps.build_status.outputs.has_active_build == 'true'
        run: |
          echo "::notice::A production build for runtime ${{ steps.build_status.outputs.runtime_version }} already exists or is in progress. Changes ship as an OTA update."

      - name: Run Production Build
        if: steps.build_status.outputs.has_active_build != 'true'
        run: eas build --profile production --platform android --non-interactive --no-wait
